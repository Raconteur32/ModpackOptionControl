<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MOC</title>
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/layout.css">
<link rel="stylesheet" href="/css/components.css">
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="logo">MOC <span>&#9679;</span></div>
    <div id="app-mode-badge"></div>
    <div id="breadcrumb"></div>
    <div id="topbar-right">
      <div id="ignores-area"></div>
      <button id="topbar-settings" class="btn-icon" title="Not implemented" disabled>&#9881;</button>
    </div>
  </div>

  <div id="body">
    <div id="main-columns">
      <div id="file-tree">
        <div class="panel-header">Files</div>
        <div id="file-tree-list"></div>
      </div>
      <div class="sep-v" id="sep-filetree"></div>

      <div id="main-area">
        <div id="main-area-content"></div>
      </div>

      <div class="sep-v" id="sep-history"></div>
      <div id="patch-history">
        <div class="panel-header">Patch History</div>
        <div id="history-list"></div>
      </div>
    </div>

    <div class="sep-h" id="sep-staging"></div>

    <div id="staging-panel">
      <!-- Panneau migré (task 4.1) : racine React, voir frontend/src/panels/StagingPanel.tsx -->
      <div data-react-panel="staging"></div>
    </div>
  </div>
</div>

<div id="dialog-root"></div>

<!-- Bundle React (store + sync WS + panneaux migrés, design D3) — généré par
     vite build, cf. gui_web/frontend. Chargé AVANT app.js : le legacy lit le
     store via l'adaptateur state.js (window.__moc). -->
<script type="module" src="/assets/mount.js"></script>
<script type="module" src="/js/app.js"></script>
</body>
</html>
